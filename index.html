<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <title>Lineflow Time Study</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app camera-app">
    <section class="camera-screen" aria-label="Lineflow camera">
      <div id="videoWrap" class="video-wrap">
        <video id="liveVideo" autoplay playsinline muted></video>
        <div id="videoFallback" class="video-fallback">
          <div class="fallback-icon" aria-hidden="true">◉</div>
          <div class="fallback-title">Camera is off</div>
          <div class="fallback-sub">Enable the camera to film this study.</div>
        </div>

        <div class="screen-gradient screen-gradient-top" aria-hidden="true"></div>
        <div class="screen-gradient screen-gradient-bottom" aria-hidden="true"></div>

        <header class="camera-topbar">
          <div class="brand-lockup">
            <span class="brand-mark" aria-hidden="true">L</span>
            <span>LINEFLOW</span>
          </div>
          <div class="timer-status" aria-live="polite">
            <span class="record-dot" aria-hidden="true"></span>
            <span id="timer" class="timer">00:00.000</span>
          </div>
          <div class="toolbar-actions">
            <button id="exportBtn" class="toolbar-btn" type="button"
              title="Download CSV, images, and video in one ZIP" disabled>
              Export Study
            </button>
          </div>
        </header>

        <div class="camera-tools">
          <button id="cameraBtn" class="toolbar-btn toolbar-btn-camera" type="button">
            <span class="toolbar-icon" aria-hidden="true">◉</span>
            Enable camera
          </button>
          <div class="process-badge">
            <span class="process-badge-label">Current process</span>
            <strong id="currentProcess">Process 1</strong>
          </div>
        </div>

        <label class="process-name-field" for="processNameInput">
          <span class="process-name-label">Process name</span>
          <input id="processNameInput" type="text" placeholder="Enter process name" autocomplete="off" />
        </label>

        <div class="idle-state">
          <p>Set up your shot, then start the time study.</p>
          <button id="startBtn" class="start-cta" type="button">Start study</button>
        </div>

        <div id="captureToast" class="capture-toast" role="status" aria-live="polite" aria-atomic="true">
          <strong id="captureToastTitle">Snapshot captured</strong>
          <span id="captureToastDetail">Saved to this process</span>
        </div>

        <div class="capture-controls" aria-label="Study controls">
          <button id="pauseBtn" class="capture-control" type="button" disabled>
            <span class="control-icon pause-icon" aria-hidden="true"><span></span><span></span></span>
            <span class="control-label">Pause</span>
          </button>
          <button id="stopBtn" class="shutter-control" type="button" disabled aria-label="Stop recording">
            <span class="shutter-icon" aria-hidden="true"></span>
            <span class="control-label">Stop</span>
          </button>
          <button id="processImageBtn" class="capture-control" type="button" disabled>
            <span class="control-icon camera-icon" aria-hidden="true"></span>
            <span class="control-label">Snapshot</span>
          </button>
          <button id="nextProcessBtn" class="capture-control" type="button" disabled>
            <span class="control-icon next-icon" aria-hidden="true"></span>
            <span class="control-label">Next</span>
          </button>
        </div>
      </div>
    </section>

    <section class="log-card" aria-label="Captured processes">
      <div class="log-header">
        <div>
          <p class="eyebrow">Study review</p>
          <h2>Captured processes</h2>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Started at</th>
              <th>Name</th>
              <th>Screenshot</th>
              <th>Preview</th>
            </tr>
          </thead>
          <tbody id="processBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
